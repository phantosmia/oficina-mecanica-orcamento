# Worker: consome a fila de comandos da saga (GerarOrcamento, CancelarOrcamento)
# e envia o e-mail com o link de aprovação. Idempotente.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orcamento-worker
  namespace: oficina-orcamento
  labels:
    app.kubernetes.io/name: orcamento-worker
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: orcamento-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orcamento-worker
        app.kubernetes.io/part-of: oficina-mecanica
    spec:
      containers:
        - name: worker
          image: oficina-mecanica-orcamento:latest
          imagePullPolicy: Always
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: orcamento-config
            - secretRef:
                name: orcamento-secret
          env:
            - name: NEW_RELIC_APP_NAME
              value: oficina-mecanica-orcamento-worker
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
