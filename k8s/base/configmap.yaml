apiVersion: v1
kind: ConfigMap
metadata:
  name: orcamento-config
  namespace: oficina-orcamento
data:
  AWS_REGION: us-east-1
  # Sobrescritos pelo overlay com os outputs do Terraform do serviço.
  ORCAMENTO_TABLE_NAME: oficina-orcamento
  ORCAMENTO_EVENTS_TOPIC_ARN: ""
  ORCAMENTO_COMMANDS_QUEUE_URL: ""
  # Base do link de aprovação enviado ao cliente (endereço público da API).
  PUBLIC_BASE_URL: http://localhost:8000
  QUOTE_VALIDITY_DAYS: "7"
  ADMIN_USERNAME: admin
  JWT_ALGORITHM: HS256
  LOG_LEVEL: INFO
  SMTP_ENABLED: "false"
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_FROM: ""
  SMTP_USERNAME: ""
  # ADR-0007: só ativa de fato com NEW_RELIC_LICENSE_KEY (secret) definida.
  NEW_RELIC_APP_NAME: oficina-mecanica-orcamento
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
